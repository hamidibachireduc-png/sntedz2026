<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E</title>
    <meta name="description" content="البوابة الرقمية الرسمية للنقابة الوطنية لعمال التربية بنظام التدرج الهيكلي والصلاحيات (وطني، ولائي، بلدي، فرع مؤسسة) وإدارة الانخراطات والمحاضر والإحصائيات." />
    <meta property="og:title" content="البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Changa:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; overflow-x: hidden; }
      #platform-frame { display: none; width: 100%; height: calc(100vh - 80px); border: none; margin-top: 80px; background: #f4f7f6; }
      #root { margin-top: 90px; }
    </style>
  </head>
  <body class="bg-[#f4f7f6] text-[#1e293b] antialiased selection:bg-[#006633] selection:text-white">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- شريط التنقل الذكي الخاص بنقابة SNTE -->
    <div id="snte-navbar" style="background: linear-gradient(to right, #006633, #004d26); border-bottom: 3px solid #FFD700; padding: 15px; display: flex; justify-content: center; gap: 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; direction: rtl; transition: top 0.4s ease-in-out; align-items: center; flex-wrap: wrap;">
      <!-- عند الضغط على اسم البوابة، تعود للصفحة الرئيسية -->
      <a href="#" onclick="showMainPortal(); return false;" style="color: #FFD700; font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 18px; text-decoration: none; margin-left: auto; cursor: pointer;">البوابة التفاعلية S.N.T.E</a>
      
      <button onclick="loadPlatform('/nathersnte2026/')" style="background: #ffffff; color: #006633; padding: 8px 25px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 700; border: 2px solid #FFD700; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">بوابة الناظر</button>
      
      <button onclick="loadPlatform('/ostadsntedz2026/')" style="background: #cc0000; color: #ffffff; padding: 8px 25px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 700; border: 2px solid #FFD700; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">بوابة الأستاذ</button>
    </div>

    <script>
      // إخفاء وإظهار الشريط عند التمرير
      let prevScrollpos = window.pageYOffset;
      window.onscroll = function() {
        let currentScrollPos = window.pageYOffset;
        if (prevScrollpos > currentScrollPos) {
          document.getElementById("snte-navbar").style.top = "0";
        } else {
          document.getElementById("snte-navbar").style.top = "-120px";
        }
        prevScrollpos = currentScrollPos;
      }

      // دوال التبديل لفتح المنصات داخل البوابة برابط مخفي
      function loadPlatform(url) {
        document.getElementById('root').style.display = 'none'; // إخفاء البوابة الرئيسية
        let iframe = document.getElementById('platform-frame');
        iframe.src = url;
        iframe.style.display = 'block'; // إظهار نافذة المنصة
        window.scrollTo(0, 0);
      }

      function showMainPortal() {
        document.getElementById('platform-frame').style.display = 'none';
        document.getElementById('platform-frame').src = '';
        document.getElementById('root').style.display = 'block'; // استرجاع البوابة الرئيسية
        window.scrollTo(0, 0);
      }
    </script>

    <!-- نافذة عرض المنصات المدمجة (مخفية افتراضياً) -->
    <iframe id="platform-frame"></iframe>

    <!-- التطبيق الأساسي للبوابة التفاعلية -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
