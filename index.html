<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E</title>
    <meta name="description" content="البوابة الرقمية الرسمية للنقابة الوطنية لعمال التربية بنظام التدرج الهيكلي والصلاحيات (وطني، ولائي، بلدي، فرع مؤسسة) وإدارة الانخراطات والمحاضر والإحصائيات." />
    <meta property="og:title" content="البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Changa:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; overflow-x: hidden; }
      #platform-frame { display: none; width: 100%; height: calc(100vh - 90px); border: none; margin-top: 90px; background: #f4f7f6; }
      #root { margin-top: 100px; }
      
      /* تأثيرات الأزرار ثلاثية الأبعاد */
      .btn-3d {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        transition: transform 0.3s ease, filter 0.3s ease;
        outline: none;
      }
      .btn-3d:hover {
        transform: translateY(-5px) scale(1.08); /* حركة صعود خفيفة وتكبير */
        filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.4)) brightness(1.1);
      }
      .btn-3d:active {
        transform: translateY(2px) scale(0.98); /* تأثير الضغط */
        filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
      }
    </style>
  </head>
  <body class="bg-[#f4f7f6] text-[#1e293b] antialiased selection:bg-[#006633] selection:text-white">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- شريط التنقل الذكي الخاص بنقابة SNTE -->
    <div id="snte-navbar" style="background: linear-gradient(to right, #006633, #004d26); border-bottom: 3px solid #FFD700; padding: 10px 20px; display: flex; justify-content: center; gap: 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; direction: rtl; transition: top 0.4s ease-in-out; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); flex-wrap: wrap;">
      
      <!-- اسم البوابة (للعودة للرئيسية) -->
      <a href="#" onclick="window.showMainPortal(); return false;" style="color: #FFD700; font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 20px; text-decoration: none; margin-left: auto; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">البوابة التفاعلية S.N.T.E</a>
      
      <!-- أيقونة بوابة الناظر -->
      <button class="btn-3d" onclick="window.loadPlatform('https://hamidibachireduc-png.github.io/nathersnte2026/')" title="بوابة الناظر">
        <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/nather-3d.png?raw=true" alt="بوابة الناظر" style="height: 65px; width: auto; border-radius: 12px;">
      </button>
      
      <!-- أيقونة بوابة الأستاذ -->
      <button class="btn-3d" onclick="window.loadPlatform('https://hamidibachireduc-png.github.io/ostadsntedz2026/')" title="بوابة الأستاذ">
        <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/ostad-3d.png?raw=true" alt="بوابة الأستاذ" style="height: 65px; width: auto; border-radius: 12px;">
      </button>

      <!-- يمكنك إضافة أيقونة بوابة المدير هنا مستقبلاً بنسخ نفس كود الزر أعلاه وتغيير الرابط والصورة -->
      
    </div>

    <script>
      // إخفاء وإظهار الشريط عند التمرير
      let prevScrollpos = window.pageYOffset;
      window.onscroll = function() {
        let currentScrollPos = window.pageYOffset;
        if (prevScrollpos > currentScrollPos) {
          document.getElementById("snte-navbar").style.top = "0";
        } else {
          document.getElementById("snte-navbar").style.top = "-120px";
        }
        prevScrollpos = currentScrollPos;
      }

      // دوال التبديل وفتح المنصات
      window.loadPlatform = function(url) {
        document.getElementById('root').style.display = 'none';
        let iframe = document.getElementById('platform-frame');
        iframe.src = url;
        iframe.style.display = 'block';
        window.scrollTo(0, 0);
      };

      window.showMainPortal = function() {
        document.getElementById('platform-frame').style.display = 'none';
        document.getElementById('platform-frame').src = '';
        document.getElementById('root').style.display = 'block';
        window.scrollTo(0, 0);
      };
    </script>

    <!-- نافذة عرض المنصات المدمجة -->
    <iframe id="platform-frame"></iframe>

    <!-- التطبيق الأساسي للبوابة التفاعلية -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
