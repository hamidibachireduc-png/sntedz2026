<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; overflow-x: hidden; }
      
      /* حاوية الشريط العائم الأساسية */
      #snte-dock-wrapper {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999; /* دائماً في الأعلى */
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      /* زر التحكم (فتح/إغلاق الشريط) */
      #toggle-dock-btn {
        background: #FFD700;
        color: #006633;
        border: 2px solid #004d26;
        border-radius: 20px;
        padding: 5px 20px;
        font-family: 'Cairo', sans-serif;
        font-weight: 900;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        transition: all 0.3s ease;
      }
      #toggle-dock-btn:hover { background: #ffea00; transform: scale(1.05); }

      /* الشريط الذي يحتوي الأيقونات */
      #snte-bottom-dock {
        background: linear-gradient(to right, #006633, #004d26);
        border: 3px solid #FFD700;
        border-radius: 25px;
        padding: 10px 30px;
        display: flex;
        align-items: center;
        gap: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.4s ease;
        /* الافتراضي: مفتوح */
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      
      /* الكلاس الذي يُضاف عند الطي */
      #snte-bottom-dock.hidden-dock {
        transform: translateY(100px) scale(0.5); /* ينزل للأسفل ويصغر */
        opacity: 0;
        pointer-events: none; /* لمنع النقر وهو مخفي */
      }

      /* تنسيق الأيقونات ثلاثية الأبعاد */
      .btn-3d {
        cursor: pointer; text-decoration: none;
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        transition: transform 0.3s ease;
      }
      .btn-3d:hover { transform: translateY(-5px) scale(1.1); }
      .btn-3d:active { transform: translateY(2px) scale(0.95); }
      .btn-3d img { height: 60px; width: auto; border-radius: 12px; pointer-events: none; }
      .btn-text { color: white; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: bold; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

      /* زر العودة للبوابة (يظهر فقط عند فتح منصة) */
      #close-platform-btn {
        background: #d9222a; color: white; border: 2px solid white;
        font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 900;
        padding: 10px 20px; border-radius: 15px; cursor: pointer;
        display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        transition: background 0.3s;
      }
      #close-platform-btn:hover { background: #b81820; }

      /* حاوية المنصات (iframe) */
      #platform-container {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
        z-index: 999998; background: #f4f7f6;
      }
      #platform-frame { width: 100%; height: 100%; border: none; }
    </style>
  </head>
  <body class="bg-[#f4f7f6] text-[#1e293b]">
    
    <!-- واجهة React الأصلية الخاصة بك المليئة بالأزرار -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- الحاوية العائمة في أسفل الشاشة (قابلة للتحكم) -->
    <div id="snte-dock-wrapper">
      
      <!-- زر التحكم في الطي والإظهار -->
      <button id="toggle-dock-btn" onclick="toggleDock()">إخفاء المنصات ▼</button>

      <!-- الشريط الذي يحتوي الأيقونات -->
      <div id="snte-bottom-dock">
        <a href="javascript:void(0)" class="btn-3d" onclick="openPlatform('https://hamidibachireduc-png.github.io/nathersnte2026/')">
          <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/nather-3d.png?raw=true" alt="الناظر">
          <span class="btn-text">بوابة الناظر</span>
        </a>
        
        <a href="javascript:void(0)" class="btn-3d" onclick="openPlatform('https://hamidibachireduc-png.github.io/ostadsntedz2026/')">
          <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/ostad-3d.png?raw=true" alt="الأستاذ">
          <span class="btn-text">بوابة الأستاذ</span>
        </a>

        <button id="close-platform-btn" onclick="closePlatform()">إغلاق والعودة</button>
      </div>

    </div>

    <!-- نافذة عرض المنصات -->
    <div id="platform-container">
      <iframe id="platform-frame"></iframe>
    </div>

    <!-- الأوامر البرمجية للحركة -->
    <script>
      let isDockVisible = true;

      // دالة طي وإظهار الشريط
      function toggleDock() {
        const dock = document.getElementById('snte-bottom-dock');
        const btn = document.getElementById('toggle-dock-btn');
        
        if (isDockVisible) {
          dock.classList.add('hidden-dock');
          btn.innerHTML = "إظهار المنصات ▲";
        } else {
          dock.classList.remove('hidden-dock');
          btn.innerHTML = "إخفاء المنصات ▼";
        }
        isDockVisible = !isDockVisible;
      }

      // دالة فتح المنصة
      function openPlatform(url) {
        document.getElementById('platform-frame').src = url;
        document.getElementById('platform-container').style.display = 'block';
        document.getElementById('close-platform-btn').style.display = 'block';
        document.getElementById('toggle-dock-btn').style.display = 'none'; // إخفاء زر الطي أثناء فتح المنصة
      }
      
      // دالة إغلاق المنصة
      function closePlatform() {
        document.getElementById('platform-container').style.display = 'none';
        document.getElementById('platform-frame').src = '';
        document.getElementById('close-platform-btn').style.display = 'none';
        document.getElementById('toggle-dock-btn').style.display = 'block'; // إرجاع زر الطي
      }
    </script>
  </body>
</html>
