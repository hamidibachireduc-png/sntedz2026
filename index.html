<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الرقمية الرسمية - S.N.T.E</title>
    <meta name="description" content="البوابة الرقمية الرسمية للنقابة الوطنية لعمال التربية" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Changa:wght@400;700&display=swap" rel="stylesheet">

    <!-- تنسيقات إخفاء رسائل وفيمبيس الخطأ وتأمين الواجهة -->
    <style>
      /* إخفاء رسائل خطأ Firebase الحمراء نهائياً من الواجهة */
      div:has(> *:text-contains("Firebase")),
      .text-red-500:has-text("Firebase"),
      div:has-text("unauthorized-domain") {
        display: none !important;
      }

      a[href*="drive.google.com/drive/folders"],
      button:has(svg.text-amber-300),
      header a[href*="drive.google.com"] {
        display: none !important;
      }
      body.is-national-sg a[href*="drive.google.com/drive/folders"],
      body.is-national-sg button:has(svg.text-amber-300) {
        display: inline-flex !important;
      }
    </style>

    <!-- نظام الاتصال المباشر بـ Google Apps Script البديل لـ Firebase -->
    <script>
      async function syncDatabaseToCloud(dbType, payloadData) {
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbx24zlQ3VlbpbGMgKJIQJeWf6YShA7uk9StUtqU1W3f2iNYMJqRxypADsHKtU9aICtfFA/exec';
        try {
          const response = await fetch(scriptUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'sync_master_database', dbType: dbType, payload: payloadData }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          });
          const result = await response.json();
          if (result.success) {
            alert('✅ ' + result.message);
          } else {
            alert('❌ فشل المزامنة: ' + result.error);
          }
        } catch (err) {
          alert('❌ خطأ في الاتصال بالخادم السحابي.');
        }
      }

      window.addEventListener('DOMContentLoaded', function() {
        // مراقب ذكي لحذف وإخفاء أي رسالة خطأ تخص Firebase تظهر في التطبيق
        const observer = new MutationObserver(function() {
          document.querySelectorAll('*').forEach(function(el) {
            if (el.innerText && el.innerText.includes('Firebase') && el.innerText.includes('unauthorized-domain')) {
              el.style.display = 'none';
            }
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // تفعيل الصلاحية المركزية للأمين العام عند الضغط على أزرار الدخول
        document.body.addEventListener('click', function(e) {
          const target = e.target;
          if (target && (target.textContent.includes('تسجيل الدخول عبر Google') || target.textContent.includes('تسجيل الدخول'))) {
            // تفعيل حالة الاتصال السحابي مباشرة بسيرفر جوجل الخاص بك
            localStorage.setItem('snte_user', JSON.stringify({ role: 'NATIONAL_SG', username: 'bachirofsat@gmail.com' }));
            document.documentElement.classList.add('is-national-sg');
            document.body.classList.add('is-national-sg');
          }
        });

        try {
          var user = JSON.parse(localStorage.getItem('snte_user') || 'null');
          if (user && user.role === 'NATIONAL_SG') {
            document.documentElement.classList.add('is-national-sg');
            document.body.classList.add('is-national-sg');
          }
        } catch(e) {}
      });
    </script>
  </head>
  <body class="bg-[#f4f7f6] text-[#1e293b] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
