<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; overflow-x: hidden; }
      
      /* حاوية الشريط العائم الأساسية (تم تفعيل مؤشر السحب عليها) */
      #snte-dock-wrapper {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        cursor: grab; /* مؤشر اليد للسحب */
      }
      #snte-dock-wrapper[hidden] { display: none; }
      #snte-dock-wrapper:active { cursor: grabbing; } /* شكل اليد عند الإمساك */

      /* زر التحكم (فتح/إغلاق) */
      #toggle-dock-btn {
        background: #FFD700; color: #006633; border: 2px solid #004d26;
        border-radius: 20px; padding: 5px 20px; font-family: 'Cairo', sans-serif;
        font-weight: 900; font-size: 12px; cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.3s ease;
      }
      #toggle-dock-btn:hover { background: #ffea00; transform: scale(1.05); }

      /* الشريط الأخضر الذي يحتوي الأيقونات */
      #snte-bottom-dock {
        background: linear-gradient(to right, #006633, #004d26);
        border: 3px solid #FFD700; border-radius: 25px;
        padding: 15px 30px 10px 30px; /* مساحة علوية إضافية لمؤشر السحب */
        display: flex; align-items: center; gap: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.4s ease;
        position: relative;
      }
      
      /* كلاس الإخفاء */
      #snte-bottom-dock.hidden-dock {
        transform: translateY(100px) scale(0.5); opacity: 0; pointer-events: none;
      }

      /* تنسيق الأيقونات ثلاثية الأبعاد */
      .btn-3d {
        cursor: pointer; text-decoration: none;
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        transition: transform 0.3s ease;
      }
      .btn-3d:hover { transform: translateY(-5px) scale(1.1); }
      .btn-3d:active { transform: translateY(2px) scale(0.95); }
      .btn-3d img { height: 60px; width: auto; border-radius: 12px; pointer-events: none; }
      .btn-text { color: white; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: bold; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

      /* زر العودة للبوابة */
      #close-platform-btn {
        background: #d9222a; color: white; border: 2px solid white;
        font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 900;
        padding: 10px 20px; border-radius: 15px; cursor: pointer;
        display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.3s;
      }
      #close-platform-btn:hover { background: #b81820; }

      /* حاوية المنصات */
      #platform-container {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
        z-index: 999998; background: #f4f7f6;
      }
      #platform-frame { width: 100%; height: 100%; border: none; }
    </style>
  </head>
  <body class="bg-[#f4f7f6] text-[#1e293b]">
    
    <!-- واجهة React الأصلية -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- الحاوية العائمة (قابلة للسحب والتحكم) -->
    <div id="snte-dock-wrapper" hidden>
      
      <button id="toggle-dock-btn" onclick="toggleDock()">إخفاء المنصات ▼</button>

      <div id="snte-bottom-dock">
        <!-- مؤشر بصري للسحب (نقاط أعلى الشريط) -->
        <div style="position: absolute; top: 4px; left: 50%; transform: translateX(-50%); color: rgba(255,215,0,0.6); font-size: 14px; pointer-events: none;">⠿</div>

        <!-- منصة المدير -->
        <a href="javascript:void(0)" class="btn-3d" onclick="openPlatform('https://hamidibachireduc-png.github.io/modirsntedz2026/')">
          <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/modir-3d.png?raw=true" alt="المدير">
          <span class="btn-text">بوابة المدير</span>
        </a>

        <a href="javascript:void(0)" class="btn-3d" onclick="openPlatform('https://hamidibachireduc-png.github.io/nathersnte2026/')">
          <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/nather-3d.png?raw=true" alt="الناظر">
          <span class="btn-text">بوابة الناظر</span>
        </a>
        
        <a href="javascript:void(0)" class="btn-3d" onclick="openPlatform('https://hamidibachireduc-png.github.io/ostadsntedz2026/')">
          <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/ostad-3d.png?raw=true" alt="الأستاذ">
          <span class="btn-text">بوابة الأستاذ</span>
        </a>

        <a href="javascript:void(0)" class="btn-3d" onclick="openPlatform('ضع_هنا_رابط_منصة_التوجيه')">
          <img src="https://github.com/hamidibachireduc-png/sntedz2026/blob/main/public/tawhihwairchade-3d.png?raw=true" alt="التوجيه والإرشاد">
          <span class="btn-text">بوابة التوجيه</span>
        </a>
        
        <!-- ملاحظة: إذا أردت حذف الزر السفلي لاحقاً لتفادي التكرار، احذف السطر التالي فقط -->
        <button id="close-platform-btn" onclick="closePlatform()">إغلاق والعودة</button>
      </div>

    </div>

    <!-- نافذة العرض -->
    <div id="platform-container">
      <iframe id="platform-frame"></iframe>
    </div>

    <!-- أكواد الحركة، السحب والإفلات -->
    <script>
      // 1. نظام طي وإظهار الشريط
      let isDockVisible = true;
      function toggleDock() {
        const dock = document.getElementById('snte-bottom-dock');
        const btn = document.getElementById('toggle-dock-btn');
        if (isDockVisible) {
          dock.classList.add('hidden-dock');
          btn.innerHTML = "إظهار المنصات ▲";
        } else {
          dock.classList.remove('hidden-dock');
          btn.innerHTML = "إخفاء المنصات ▼";
        }
        isDockVisible = !isDockVisible;
      }

      function openPlatform(url) {
        document.getElementById('platform-frame').src = url;
        document.getElementById('platform-container').style.display = 'block';
        
        // إذا قمت بحذف الزر السفلي، احذف السطر التالي أيضاً
        document.getElementById('close-platform-btn').style.display = 'block';
        
        document.getElementById('toggle-dock-btn').style.display = 'none'; 
      }

      function closePlatform() {
        document.getElementById('platform-container').style.display = 'none';
        
        // التعديل الرئيسي لمنع خروج الصفحة: تم تغيير '' إلى 'about:blank'
        document.getElementById('platform-frame').src = 'about:blank';
        
        // إذا قمت بحذف الزر السفلي، احذف السطر التالي أيضاً
        document.getElementById('close-platform-btn').style.display = 'none';
        
        document.getElementById('toggle-dock-btn').style.display = 'block'; 
      }

      // 2. نظام السحب والإفلات المتقدم (Mouse & Touch)
      const dockWrapper = document.getElementById("snte-dock-wrapper");
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

      // أحداث الماوس للكمبيوتر
      dockWrapper.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        if (e.target.closest('a') || e.target.closest('button')) return;
        e.preventDefault();
        pos3 = e.clientX; pos4 = e.clientY;
        
        const rect = dockWrapper.getBoundingClientRect();
        dockWrapper.style.left = rect.left + "px";
        dockWrapper.style.top = rect.top + "px";
        dockWrapper.style.bottom = "auto";
        dockWrapper.style.transform = "none";

        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
        pos3 = e.clientX; pos4 = e.clientY;
        dockWrapper.style.top = (dockWrapper.offsetTop - pos2) + "px";
        dockWrapper.style.left = (dockWrapper.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }

      // أحداث اللمس للهواتف الذكية
      dockWrapper.addEventListener('touchstart', function(e) {
        if (e.target.closest('a') || e.target.closest('button')) return;
        let touch = e.touches[0];
        pos3 = touch.clientX; pos4 = touch.clientY;
        
        const rect = dockWrapper.getBoundingClientRect();
        dockWrapper.style.left = rect.left + "px";
        dockWrapper.style.top = rect.top + "px";
        dockWrapper.style.bottom = "auto";
        dockWrapper.style.transform = "none";
        
        document.addEventListener('touchend', closeDragElementTouch);
        document.addEventListener('touchmove', elementDragTouch, {passive: false});
      }, {passive: false});

      function elementDragTouch(e) {
        if (e.target.closest('a') || e.target.closest('button')) return;
        e.preventDefault();
        let touch = e.touches[0];
        pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
        pos3 = touch.clientX; pos4 = touch.clientY;
        dockWrapper.style.top = (dockWrapper.offsetTop - pos2) + "px";
        dockWrapper.style.left = (dockWrapper.offsetLeft - pos1) + "px";
      }

      function closeDragElementTouch() {
        document.removeEventListener('touchend', closeDragElementTouch);
        document.removeEventListener('touchmove', elementDragTouch);
      }

      function syncDockVisibility() {
        const dockWrapper = document.getElementById('snte-dock-wrapper');
        let isSignedIn = false;

        try {
          const user = JSON.parse(localStorage.getItem('snte_user') || 'null');
          isSignedIn = Boolean(
            user &&
            typeof user === 'object' &&
            (user.id || user.username) &&
            (user.role || user.level)
          );
        } catch (error) {
          console.error('تعذر التحقق من حالة تسجيل الدخول لإظهار المنصات.', error);
        }

        dockWrapper.hidden = !isSignedIn;
        if (!isSignedIn) closePlatform();
      }

      window.addEventListener('storage', (event) => {
        if (event.key === 'snte_user' || event.key === null) syncDockVisibility();
      });
      window.setInterval(syncDockVisibility, 1000);
      syncDockVisibility();
    </script>
  </body>
</html>
