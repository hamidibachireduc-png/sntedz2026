<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الرقمية الرسمية - S.N.T.E</title>
    <meta name="description" content="البوابة الرقمية الرسمية للنقابة الوطنية لعمال التربية" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Changa:wght@400;700&display=swap" rel="stylesheet">

    <!-- قسم التصميم الصافي -->
    <style>
      a[href*="drive.google.com/drive/folders"],
      button:has(svg.text-amber-300),
      header a[href*="drive.google.com"] {
        display: none !important;
      }
      body.is-national-sg a[href*="drive.google.com/drive/folders"],
      body.is-national-sg button:has(svg.text-amber-300) {
        display: inline-flex !important;
      }
    </style>

    <!-- نظام الاتصال السحابي المباشر بدون Firebase -->
    <script>
      async function syncDatabaseToCloud(dbType, payloadData) {
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbx24zlQ3VlbpbGMgKJIQJeWf6YShA7uk9StUtqU1W3f2iNYMJqRxypADsHKtU9aICtfFA/exec';
        try {
          const response = await fetch(scriptUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'sync_master_database', dbType: dbType, payload: payloadData }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
          });
          const result = await response.json();
          if (result.success) {
            alert('✅ ' + result.message);
          } else {
            alert('❌ فشل المزامنة: ' + result.error);
          }
        } catch (err) {
          alert('❌ خطأ في الاتصال بالخادم السحابي.');
        }
      }

      window.addEventListener('DOMContentLoaded', function() {
        try {
          var user = JSON.parse(localStorage.getItem('snte_user') || 'null');
          if (user && user.role === 'NATIONAL_SG') {
            document.documentElement.classList.add('is-national-sg');
            document.body.classList.add('is-national-sg');
          }
        } catch(e) {}

        document.body.addEventListener('submit', async function(e) {
          const target = e.target;
          if (target && target.tagName === 'FORM' && target.textContent.includes('تسجيل الدخول')) {
            e.preventDefault(); 
            const inputs = target.querySelectorAll('input');
            let username = '';
            let password = '';
            inputs.forEach(input => {
              if (input.type === 'password' || input.placeholder.includes('الرقم السري')) password = input.value;
              else if (input.type === 'text' || input.placeholder.includes('المستخدم')) username = input.value;
            });

            try {
              const scriptUrl = 'https://script.google.com/macros/s/AKfycbx24zlQ3VlbpbGMgKJIQJeWf6YShA7uk9StUtqU1W3f2iNYMJqRxypADsHKtU9aICtfFA/exec';
              const response = await fetch(scriptUrl, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', username: username, password: password }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
              });
              const result = await response.json();

              if (result.success) {
                localStorage.setItem('snte_user', JSON.stringify(result.user));
                window.location.reload(); 
              } else {
                alert('عذراً: ' + result.error);
              }
            } catch (err) {
              alert('فشل الاتصال بخادم التحقق السحابي.');
            }
          }
        });
      });
    </script>
  </head>
  <body class="bg-[#f4f7f6] text-[#1e293b] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
