<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E</title>
    <meta name="description" content="البوابة الرقمية الرسمية للنقابة الوطنية لعمال التربية بنظام التدرج الهيكلي والصلاحيات (وطني، ولائي، بلدي، فرع مؤسسة) وإدارة الانخراطات والمحاضر والإحصائيات." />
    <meta property="og:title" content="البوابة الرقمية الرسمية - النقابة الوطنية لعمال التربية S.N.T.E" />
    <meta property="og:description" content="البوابة الرقمية الرسمية للنقابة الوطنية لعمال التربية بنظام التدرج الهيكلي والصلاحيات (وطني، ولائي، بلدي، فرع مؤسسة) وإدارة الانخراطات والمحاضر والإحصائيات." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Changa:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
      /* إخفاء زري مجلد Drive وشيتات Sheets تلقائياً */
      a[href*="drive.google.com/drive/folders"],
      button:has(svg.text-amber-300),
      header a[href*="drive.google.com"] {
        display: none !important;
      }

      /* يظهران فقط عندما يسجل الأمين العام الوطني دخوله */
      body.is-national-sg a[href*="drive.google.com/drive/folders"] {
        display: inline-flex !important;
      }
    <script>
     <script>
      // نظام الأمان والحماية المركزية (تخطي التحقق المكشوف)
      window.addEventListener('DOMContentLoaded', function() {
        
        // 1. التحقق الفوري لإظهار/إخفاء أزرار القيادة (الكود السابق)
        try {
          var user = JSON.parse(localStorage.getItem('snte_user') || 'null');
          if (user && user.role === 'NATIONAL_SG') {
            document.documentElement.classList.add('is-national-sg');
            document.body.classList.add('is-national-sg');
          }
        } catch(e) {}

        // 2. اعتراض عملية تسجيل الدخول وحقن الاتصال الآمن بـ Apps Script
        document.body.addEventListener('submit', async function(e) {
          const target = e.target;
          // التأكد من أن النموذج المرسل هو نموذج الدخول
          if (target && target.tagName === 'FORM' && target.textContent.includes('تسجيل الدخول')) {
            e.preventDefault(); // إيقاف العملية الافتراضية
            
            // استخراج البيانات من الحقول
            const inputs = target.querySelectorAll('input');
            let username = '';
            let password = '';
            inputs.forEach(input => {
              if (input.type === 'password' || input.placeholder.includes('الرقم السري')) password = input.value;
              else if (input.type === 'text' || input.placeholder.includes('المستخدم')) username = input.value;
            });

            const submitBtn = target.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn ? submitBtn.innerText : '';
            if (submitBtn) {
              submitBtn.innerText = 'جاري التحقق الآمن...';
              submitBtn.disabled = true;
            }

            try {
              const scriptUrl = 'https://script.google.com/macros/s/AKfycbx24zlQ3VlbpbGMgKJIQJeWf6YShA7uk9StUtqU1W3f2iNYMJqRxypADsHKtU9aICtfFA/exec';
              const response = await fetch(scriptUrl, {
                method: 'POST',
                body: JSON.stringify({ username: username, password: password }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
              });
              const result = await response.json();

              if (result.success) {
                // حفظ الجلسة وتحديث الصفحة للدخول للوحة التحكم
                localStorage.setItem('snte_user', JSON.stringify(result.user));
                window.location.reload(); 
              } else {
                alert('عذراً: ' + result.error);
                if (submitBtn) {
                  submitBtn.innerText = originalBtnText;
                  submitBtn.disabled = false;
                }
              }
            } catch (err) {
              alert('فشل الاتصال بخادم التحقق. يرجى التأكد من إعداداتك.');
              if (submitBtn) {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
              }
            }
          }
        });
      });
    </script>
  </head>
  <body class="bg-[#f4f7f6] text-[#1e293b] antialiased selection:bg-[#006633] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
